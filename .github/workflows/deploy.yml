name: Деплой към GitHub Pages

on:
    push:
        branches: [main]
    # Позволява ръчно пускане от раздела Actions в GitHub.
    workflow_dispatch:

# Правата са минималните, нужни за публикуване на Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Ако избутаме два коммита бързо един след друг, довършваме само последния.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # Липсващ ключ не проваля билда — Vite просто слага празен низ и
            # приложението гърми чак в браузъра на потребителя, с бял екран и
            # зелен CI. Затова спираме тук, преди да сме публикували нещо.
            # Стойностите не се отпечатват, само дали изобщо ги има.
            - name: Проверка на ключовете
              env:
                  URL: ${{ secrets.VITE_SUPABASE_URL }}
                  KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
              run: |
                  test -n "$URL" || { echo "::error::Липсва secret VITE_SUPABASE_URL. Добави го в Settings -> Secrets and variables -> Actions -> Repository secrets."; exit 1; }
                  test -n "$KEY" || { echo "::error::Липсва secret VITE_SUPABASE_ANON_KEY. Добави го в Settings -> Secrets and variables -> Actions -> Repository secrets."; exit 1; }
                  echo "Двата ключа са налице."

            - name: Инсталиране на зависимостите
              run: npm ci

            - name: Билд
              env:
                  # Тези две стойности се вграждат в JavaScript файла и са
                  # публични по замисъл — anon ключът е безопасен в браузъра,
                  # защото достъпът се ограничава от RLS политиките в базата.
                  # Държим ги като secrets само за да могат да се сменят без
                  # ново редактиране на кода.
                  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
              run: npm run build

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
